<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; }
  body { font-family: var(--gfx-font, 'Barlow Condensed', sans-serif); }
  #mv-root {
    position:absolute; inset:0; display:flex;
    align-items:center; justify-content:center;
    opacity:0; transform:translateY(22px);
    transition: opacity .5s var(--gfx-ease-enter, cubic-bezier(.22,1,.36,1)), transform .5s var(--gfx-ease-enter, cubic-bezier(.22,1,.36,1));
    text-transform: var(--gfx-text-transform, uppercase);
  }
  #mv-root.show { opacity:1; transform:none; }
  #mv-stage { display:flex; flex-direction:column; align-items:center; gap:30px;
    transition: transform .4s var(--gfx-ease-move, cubic-bezier(.4,0,.2,1)); transform-origin:center center; }
  /* Scale variants — large/normal are the same centred layout at different sizes. */
  #mv-root.scale-large  #mv-stage { transform: scale(1.2); }
  #mv-root.scale-normal #mv-stage { transform: scale(1); }

  /* Lower-third variant: a bottom-anchored compact band that leaves the upper frame
     free for caster/host cameras. Short wide map chips (not the tall full-screen cards)
     in a single row; same ban/pick/decider info, sized for a lower third. */
  #mv-root.scale-l3 { align-items:flex-end; justify-content:center; padding:0 0 46px; }
  #mv-root.scale-l3 #mv-stage { transform:none; gap:14px; width:auto; max-width:1820px; }
  #mv-root.scale-l3 #mv-head  { gap:22px; }
  #mv-root.scale-l3 .mv-team  { min-width:0; gap:10px; }
  #mv-root.scale-l3 .mv-team img { width:44px; height:44px; }
  #mv-root.scale-l3 .mv-team .nm { font-size:26px; }
  #mv-root.scale-l3 #mv-title { font-size:21px; letter-spacing:.2em; }
  #mv-root.scale-l3 #mv-vs    { font-size:15px; }
  #mv-root.scale-l3 #mv-bo    { font-size:12px; }
  #mv-root.scale-l3 #mv-strip { gap:12px; }
  #mv-root.scale-l3 .mv-card  { width:176px; height:150px; justify-content:flex-end; }
  #mv-root.scale-l3 .mv-card .scrim { background:linear-gradient(180deg, rgba(6,10,15,.15) 0%, rgba(6,10,15,.6) 45%, rgba(6,10,15,.95) 100%); }
  #mv-root.scale-l3 .mv-order { width:26px; height:26px; font-size:14px; top:8px; left:8px; }
  #mv-root.scale-l3 .mv-name  { font-size:23px; padding:0 12px 3px; }
  #mv-root.scale-l3 .mv-foot  { padding:5px 12px 10px; gap:2px; }
  #mv-root.scale-l3 .mv-action{ font-size:16px; }
  #mv-root.scale-l3 .mv-sub   { font-size:12px; }
  /* Event logo would float into the camera area at the top — pin it just above the
     band in the lower-third variant. */
  #mv-root.scale-l3 #mv-logo-wrap { top:auto; bottom:236px; }

  /* Logo */
  #mv-logo-wrap { position:absolute; top:60px; width:100%; display:flex; pointer-events:none; }
  #mv-logo-wrap.left   { justify-content:flex-start; padding-left:90px; }
  #mv-logo-wrap.center { justify-content:center; }
  #mv-logo-wrap.right  { justify-content:flex-end; padding-right:90px; }
  #mv-logo { display:none; object-fit:contain; }

  /* Header */
  #mv-head { display:flex; align-items:center; gap:44px; }
  .mv-team { display:flex; align-items:center; gap:16px; min-width:330px; }
  .mv-team.right { flex-direction:row-reverse; text-align:right; }
  .mv-team img { width:74px; height:74px; object-fit:contain; }
  .mv-team img:not([src]), .mv-team img[src=""] { display:none; }
  .mv-team .nm { font-size:44px; font-weight:800; color:#fff; }
  #mv-center { display:flex; flex-direction:column; align-items:center; gap:5px; }
  #mv-title { font-size:30px; font-weight:700; letter-spacing:.22em; color: var(--gfx-c1, #1ffaff); }
  #mv-vs { font-size:22px; font-weight:900; color:#8a929b; letter-spacing:.2em; }
  #mv-bo { font-size:15px; font-weight:700; letter-spacing:.28em; color:#cfd6dd; opacity:.85; }

  /* Strip */
  #mv-strip { display:flex; gap:18px; }
  .mv-card {
    width:208px; height:438px; position:relative; overflow:hidden;
    border-radius: var(--gfx-radius, 4px);
    background: var(--gfx-panel-bg, linear-gradient(180deg, rgba(20,28,38,.92), rgba(8,12,18,.96)));
    border: 1px solid var(--gfx-panel-border, rgba(255,255,255,.10));
    display:flex; flex-direction:column; justify-content:flex-end;
    box-shadow: 0 12px 34px rgba(0,0,0,.45);
    opacity:0; transform:translateY(26px);
    transition: opacity .42s var(--gfx-ease-enter, cubic-bezier(.22,1,.36,1)), transform .42s var(--gfx-ease-enter, cubic-bezier(.22,1,.36,1));
    transition-delay: calc(var(--i, 0) * 55ms);
  }
  #mv-root.show .mv-card { opacity:1; transform:none; }
  .mv-card .img { position:absolute; inset:0; background-size:cover; background-position:center; }
  .mv-card .scrim { position:absolute; inset:0; background:linear-gradient(180deg, rgba(6,10,15,.10) 0%, rgba(6,10,15,.5) 52%, rgba(6,10,15,.93) 100%); }
  .mv-order { position:absolute; top:12px; left:12px; z-index:3; width:34px; height:34px; border-radius:50%;
    background:rgba(8,12,18,.8); border:1px solid rgba(255,255,255,.18); color:#fff;
    font-size:18px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .mv-name { position:relative; z-index:2; padding:0 16px 6px; font-size:30px; font-weight:800; color:#fff; line-height:1.05; }
  .mv-foot { position:relative; z-index:2; padding:10px 16px 16px; display:flex; flex-direction:column; gap:3px; }
  .mv-action { font-size:23px; font-weight:900; letter-spacing:.1em; }
  .mv-sub { font-size:16px; font-weight:700; color:#e6eaef; letter-spacing:.03em; }
  .mv-sub.dim { color:#aab2bb; }

  .mv-card.ban .img { filter:grayscale(1) brightness(.42); }
  .mv-card.ban      { opacity:0; }
  #mv-root.show .mv-card.ban { opacity:.6; }
  .mv-card.ban .mv-action { color:#ff5a5a; }
  .mv-card.pick     { border-color: var(--gfx-c1, #1ffaff); box-shadow:0 0 0 2px var(--gfx-c1, #1ffaff), 0 12px 34px rgba(0,0,0,.5); }
  .mv-card.pick .mv-action { color: var(--gfx-c1, #1ffaff); }
  .mv-card.decider  { border-color:#ffd24a; box-shadow:0 0 0 2px #ffd24a, 0 12px 38px rgba(0,0,0,.55); }
  .mv-card.decider .mv-action { color:#ffd24a; }
  .mv-card.pending .mv-action { color:#8a929b; }
</style>
</head>
<body>
<div id="mv-root">
  <div id="mv-logo-wrap"><img id="mv-logo" alt=""></div>
  <div id="mv-stage">
    <div id="mv-head">
      <div class="mv-team left"><img id="mv-t1-logo" alt=""><span class="nm" id="mv-t1-name">Team 1</span></div>
      <div id="mv-center"><div id="mv-title">MAP VETO</div><div id="mv-vs">VS</div><div id="mv-bo">BEST OF 3</div></div>
      <div class="mv-team right"><img id="mv-t2-logo" alt=""><span class="nm" id="mv-t2-name">Team 2</span></div>
    </div>
    <div id="mv-strip"></div>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/graphics/gfx-settings.js"></script>
<script>
(function(){
  var token = new URLSearchParams(location.search).get('token') || '';
  var socket = io({ auth:{ token:token }, query:{ token:token } });
  var root = document.getElementById('mv-root');
  var strip = document.getElementById('mv-strip');
  var _visible = false, _hash = '';
  function eH(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  var BO = { 1:'BEST OF 1', 3:'BEST OF 3', 5:'BEST OF 5' };
  function poolImage(pool, name){ var e=(pool||[]).find(function(p){return (p.name||'')===name;}); return e?(e.image||''):''; }
  function teamLabel(m, key){ var t=m[key]||{}; return t.tag || t.name || (key==='team1'?'Team 1':'Team 2'); }
  function sideLabel(sd){ return sd==='knife' ? 'KNIFE ROUND' : (sd ? sd + ' START' : ''); }

  function render(state){
    var mv = state.mapVeto||{}, m = state.match||{};
    var pool = (state.tournament && state.tournament.mapPool) || [];
    var t1=m.team1||{}, t2=m.team2||{};
    root.classList.remove('scale-large','scale-normal','scale-l3');
    root.classList.add('scale-' + (mv.scale || 'normal'));
    document.getElementById('mv-title').textContent = mv.title || 'MAP VETO';
    document.getElementById('mv-bo').textContent = BO[mv.bestOf] || ('BEST OF ' + (mv.bestOf||3));
    document.getElementById('mv-t1-name').textContent = t1.name || 'Team 1';
    document.getElementById('mv-t2-name').textContent = t2.name || 'Team 2';
    var l1=document.getElementById('mv-t1-logo'), l2=document.getElementById('mv-t2-logo');
    if(t1.logo){ l1.src=t1.logo; l1.style.display=''; } else l1.style.display='none';
    if(t2.logo){ l2.src=t2.logo; l2.style.display=''; } else l2.style.display='none';
    // Event logo
    var lw=document.getElementById('mv-logo-wrap'), lg=document.getElementById('mv-logo');
    lw.className = mv.logoPosition || 'left';
    if(mv.showLogo && mv.logoUrl){ lg.src=mv.logoUrl; lg.style.display=''; lg.style.height=((mv.logoScale||7)*8)+'px'; }
    else { lg.style.display='none'; }

    var steps = (mv.steps && mv.steps.length) ? mv.steps
      : pool.map(function(p){ return { action:'pending', map:p.name, team:'', side:'' }; });

    strip.innerHTML = steps.map(function(s, i){
      var action=(s.action||'pending'), img=poolImage(pool, s.map);
      var orderHtml = (action==='pending') ? '' : '<div class="mv-order">'+(i+1)+'</div>';
      var actLabel='', sub1='', sub2='';
      if (action==='ban'){ actLabel='BAN'; sub1 = s.team ? teamLabel(m, s.team) : ''; }
      else if (action==='pick'){
        actLabel='PICK';
        sub1 = (s.team ? teamLabel(m, s.team) : '') + ' PICK';   // who picked the map
        var other = s.team==='team1' ? 'team2' : (s.team==='team2' ? 'team1' : '');
        if (other && s.side) sub2 = teamLabel(m, other) + ' ' + sideLabel(s.side); // other team's start side
      }
      else if (action==='decider'){ actLabel='DECIDER';
        sub1 = (s.side==='knife' || !s.side) ? 'KNIFE ROUND' : ((s.team?teamLabel(m,s.team)+' ':'') + sideLabel(s.side)); }
      // sub1 styling: for pick the action line already says PICK, so show picker as sub
      var footHtml='';
      if (action==='ban'){ footHtml = '<div class="mv-action">BAN</div>' + (sub1?'<div class="mv-sub dim">'+eH(sub1)+'</div>':''); }
      else if (action==='pick'){ footHtml = '<div class="mv-action">'+eH(sub1)+'</div>' + (sub2?'<div class="mv-sub">'+eH(sub2)+'</div>':''); }
      else if (action==='decider'){ footHtml = '<div class="mv-action">DECIDER</div><div class="mv-sub">'+eH(sub1)+'</div>'; }
      return '<div class="mv-card '+action+'" style="--i:'+i+'">' +
        (img ? '<div class="img" style="background-image:url(\''+eH(img)+'\')"></div>' : '') +
        '<div class="scrim"></div>' + orderHtml +
        '<div class="mv-name">'+eH(s.map||'')+'</div>' +
        '<div class="mv-foot">'+footHtml+'</div></div>';
    }).join('');
  }

  function hashState(state){
    var mv = state.mapVeto||{}, m = state.match||{};
    return JSON.stringify({ s:mv.steps, p:(state.tournament&&state.tournament.mapPool), t:mv.title, bo:mv.bestOf, sc:mv.scale,
      lg:mv.showLogo, lu:mv.logoUrl, ls:mv.logoScale, lp:mv.logoPosition,
      t1:(m.team1||{}).name, t2:(m.team2||{}).name, l1:(m.team1||{}).logo, l2:(m.team2||{}).logo });
  }

  socket.on('state', function(state){
    if (window.GfxSettings){ GfxSettings.applyTheme(document.documentElement, state); GfxSettings.applyAnimation(document.documentElement, state, 'mapVeto'); GfxSettings.clearBackground(document.body); }
    var visible = !!(state.mapVeto && state.mapVeto.visible);
    var h = hashState(state);
    if (visible){
      if (!_visible || h !== _hash){ render(state); _hash = h; }
      if (!_visible){ _visible = true; requestAnimationFrame(function(){ root.classList.add('show'); }); }
    } else if (_visible){
      _visible = false; root.classList.remove('show');
    }
  });
  socket.on('connect', function(){ _visible = false; root.classList.remove('show'); });
})();
</script>
</body>
</html>
