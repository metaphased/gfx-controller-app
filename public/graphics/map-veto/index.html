<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; }
  body { font-family: var(--gfx-font, 'Barlow Condensed', sans-serif); }
  #mv-root {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:34px;
    opacity:0; text-transform: var(--gfx-text-transform, uppercase);
  }
  #mv-root.in  { animation: mv-fade var(--gfx-dur-in, .5s) var(--gfx-ease-enter, cubic-bezier(.22,1,.36,1)) forwards; }
  #mv-root.out { animation: mv-fade var(--gfx-dur-out, .35s) var(--gfx-ease-exit, cubic-bezier(.64,0,.78,0)) reverse forwards; }
  @keyframes mv-fade { from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:none;} }

  /* Header: teams + title */
  #mv-head { display:flex; align-items:center; gap:40px; }
  .mv-team { display:flex; align-items:center; gap:16px; min-width:340px; }
  .mv-team.right { flex-direction:row-reverse; text-align:right; }
  .mv-team img { width:78px; height:78px; object-fit:contain; }
  .mv-team .nm { font-size:46px; font-weight:800; color:#fff; letter-spacing:.01em; }
  #mv-center { display:flex; flex-direction:column; align-items:center; gap:6px; }
  #mv-title { font-size:30px; font-weight:700; letter-spacing:.22em; color: var(--gfx-c1, #1ffaff); }
  #mv-bo { font-size:16px; font-weight:700; letter-spacing:.28em; color:#cfd6dd; opacity:.8; }
  #mv-vs { font-size:24px; font-weight:900; color:#8a929b; letter-spacing:.2em; }

  /* Map strip */
  #mv-strip { display:flex; gap:18px; }
  .mv-card {
    width:206px; height:430px; position:relative; overflow:hidden;
    border-radius: var(--gfx-radius, 4px);
    background: var(--gfx-panel-bg, linear-gradient(180deg, rgba(20,28,38,.92), rgba(8,12,18,.96)));
    border: 1px solid var(--gfx-panel-border, rgba(255,255,255,.10));
    display:flex; flex-direction:column; justify-content:flex-end;
    box-shadow: 0 12px 34px rgba(0,0,0,.45);
  }
  .mv-card .img { position:absolute; inset:0; background-size:cover; background-position:center; }
  .mv-card .scrim { position:absolute; inset:0; background:linear-gradient(180deg, rgba(6,10,15,.15) 0%, rgba(6,10,15,.55) 55%, rgba(6,10,15,.92) 100%); }
  .mv-order { position:absolute; top:12px; left:12px; z-index:3; width:34px; height:34px; border-radius:50%;
    background:rgba(8,12,18,.78); border:1px solid rgba(255,255,255,.18); color:#fff;
    font-size:18px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .mv-name { position:relative; z-index:2; padding:0 16px 8px; font-size:30px; font-weight:800; color:#fff; }
  .mv-foot { position:relative; z-index:2; padding:12px 16px 16px; display:flex; flex-direction:column; gap:4px; }
  .mv-action { font-size:22px; font-weight:900; letter-spacing:.12em; }
  .mv-sub { font-size:17px; font-weight:700; color:#cfd6dd; letter-spacing:.04em; }

  /* States */
  .mv-card.ban .img    { filter:grayscale(1) brightness(.45); }
  .mv-card.ban         { opacity:.62; }
  .mv-card.ban .mv-action { color:#ff5a5a; }
  .mv-card.pick        { border-color: var(--gfx-c1, #1ffaff); box-shadow:0 0 0 2px var(--gfx-c1, #1ffaff), 0 12px 34px rgba(0,0,0,.5); }
  .mv-card.pick .mv-action { color: var(--gfx-c1, #1ffaff); }
  .mv-card.decider     { border-color:#ffd24a; box-shadow:0 0 0 2px #ffd24a, 0 12px 38px rgba(0,0,0,.55); }
  .mv-card.decider .mv-action { color:#ffd24a; }
  .mv-card.pending .mv-action { color:#8a929b; }
</style>
</head>
<body>
<div id="mv-root">
  <div id="mv-head">
    <div class="mv-team left"><img id="mv-t1-logo" alt=""><span class="nm" id="mv-t1-name">Team 1</span></div>
    <div id="mv-center"><div id="mv-title">MAP VETO</div><div id="mv-vs">VS</div><div id="mv-bo">BEST OF 3</div></div>
    <div class="mv-team right"><img id="mv-t2-logo" alt=""><span class="nm" id="mv-t2-name">Team 2</span></div>
  </div>
  <div id="mv-strip"></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/graphics/gfx-settings.js"></script>
<script>
(function(){
  var token = new URLSearchParams(location.search).get('token') || '';
  var socket = io({ auth:{ token:token }, query:{ token:token } });
  var root = document.getElementById('mv-root');
  var strip = document.getElementById('mv-strip');
  var _visible = false, _hash = '';
  function eH(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  var BO = { 1:'BEST OF 1', 3:'BEST OF 3', 5:'BEST OF 5' };

  function poolImage(pool, name){
    var e = (pool||[]).find(function(p){ return (p.name||'') === name; });
    return e ? (e.image||'') : '';
  }
  function teamLabel(m, key){ var t = m[key]||{}; return t.tag || t.name || (key==='team1'?'Team 1':'Team 2'); }

  function render(state){
    var mv = state.mapVeto||{}, m = state.match||{};
    var t1=m.team1||{}, t2=m.team2||{};
    document.getElementById('mv-title').textContent = mv.title || 'MAP VETO';
    document.getElementById('mv-bo').textContent = BO[mv.bestOf] || ('BEST OF ' + (mv.bestOf||3));
    document.getElementById('mv-t1-name').textContent = t1.name || 'Team 1';
    document.getElementById('mv-t2-name').textContent = t2.name || 'Team 2';
    var l1=document.getElementById('mv-t1-logo'), l2=document.getElementById('mv-t2-logo');
    l1.src=t1.logo||''; l1.style.display=t1.logo?'':'none';
    l2.src=t2.logo||''; l2.style.display=t2.logo?'':'none';

    // Source rows: the ordered veto steps; before any are entered, show the pool neutral.
    var steps = (mv.steps && mv.steps.length) ? mv.steps
      : (mv.pool||[]).map(function(p){ return { action:'pending', map:p.name, team:'', side:'' }; });

    strip.innerHTML = steps.map(function(s, i){
      var action = (s.action||'pending');
      var img = poolImage(mv.pool, s.map);
      var cls = 'mv-card ' + action;
      var orderHtml = (action==='pending') ? '' : '<div class="mv-order">'+(i+1)+'</div>';
      var actLabel, subLabel='';
      if (action==='ban')      { actLabel='BAN';     subLabel = s.team ? teamLabel(m, s.team) : ''; }
      else if (action==='pick'){ actLabel='PICK';    subLabel = (s.team ? teamLabel(m, s.team) : '') + (s.side ? ' · '+s.side : ''); }
      else if (action==='decider'){ actLabel='DECIDER'; subLabel = s.side ? s.side : ''; }
      else                     { actLabel=''; }
      return '<div class="'+cls+'">' +
        (img ? '<div class="img" style="background-image:url(\''+eH(img)+'\')"></div>' : '') +
        '<div class="scrim"></div>' + orderHtml +
        '<div class="mv-name">'+eH(s.map||'')+'</div>' +
        '<div class="mv-foot">' +
          (actLabel ? '<div class="mv-action">'+actLabel+'</div>' : '') +
          (subLabel ? '<div class="mv-sub">'+eH(subLabel)+'</div>' : '') +
        '</div></div>';
    }).join('');
  }

  function hashState(state){
    var mv = state.mapVeto||{}, m = state.match||{};
    return JSON.stringify({ s:mv.steps, p:mv.pool, t:mv.title, bo:mv.bestOf,
      t1:(m.team1||{}).name, t2:(m.team2||{}).name, l1:(m.team1||{}).logo, l2:(m.team2||{}).logo });
  }

  socket.on('state', function(state){
    if (window.GfxSettings){ GfxSettings.applyTheme(document.documentElement, state); GfxSettings.applyAnimation(document.documentElement, state, 'mapVeto'); GfxSettings.clearBackground(document.body); }
    var mv = state.mapVeto||{};
    var visible = !!mv.visible;
    var h = hashState(state);
    if (visible){
      if (!_visible || h !== _hash){ render(state); _hash = h; }
      if (!_visible){ _visible = true; root.classList.remove('out'); root.classList.add('in'); }
    } else if (_visible){
      _visible = false; root.classList.remove('in'); root.classList.add('out');
    }
  });
  socket.on('connect', function(){ _visible = false; });
})();
</script>
</body>
</html>
