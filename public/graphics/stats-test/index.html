<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stats Reference</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<script src="/graphics/gfx-settings.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100vw; height: 100vh; overflow: hidden; background: #060c14; color: #fff; font-family: 'Barlow Condensed', sans-serif; }

/* ── Layout ── */
#root { display: flex; flex-direction: column; width: 100vw; height: 100vh; }

.match-header {
  display: flex; align-items: center; justify-content: center; gap: 2vw;
  background: rgba(255,255,255,0.04); border-bottom: 1px solid rgba(255,255,255,0.1);
  padding: 1.2vh 3vw; flex-shrink: 0;
}
.match-header .team-name { font-size: 3.2vh; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; }
.match-header .vs { font-size: 1.8vh; font-weight: 700; color: rgba(255,255,255,0.3); letter-spacing: 0.3em; }
.match-header .team-logo { width: 5vh; height: 5vh; object-fit: contain; }

.teams-grid {
  flex: 1; display: grid; grid-template-columns: 1fr 1fr;
  gap: 0; overflow: hidden;
}
.team-col {
  display: flex; flex-direction: column; overflow-y: auto;
  border-right: 1px solid rgba(255,255,255,0.07);
}
.team-col:last-child { border-right: none; }

.team-header {
  display: flex; align-items: center; gap: 1.2vw;
  padding: 1.4vh 2vw; background: rgba(255,255,255,0.03);
  border-bottom: 1px solid rgba(255,255,255,0.08); flex-shrink: 0;
}
.team-header img { width: 4.5vh; height: 4.5vh; object-fit: contain; }
.team-header .t-name { font-size: 2.4vh; font-weight: 900; text-transform: uppercase; letter-spacing: 0.06em; }
.team-header .t-tag  { font-size: 1.3vh; font-weight: 700; letter-spacing: 0.2em; color: rgba(255,255,255,0.4); }

/* ── Player card ── */
.player-card {
  padding: 1.4vh 2vw;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.player-card:last-child { border-bottom: none; }

.pc-top { display: flex; align-items: baseline; gap: 1vw; margin-bottom: 0.5vh; }
.pc-role  { font-size: 1.1vh; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.35); min-width: 6vw; }
.pc-handle { font-size: 2.8vh; font-weight: 900; text-transform: uppercase; letter-spacing: 0.04em; }
.pc-riot-id { font-size: 1.1vh; font-weight: 600; color: rgba(255,255,255,0.3); letter-spacing: 0.05em; }

.pc-rank-row { display: flex; align-items: center; gap: 1.2vw; margin-bottom: 0.6vh; flex-wrap: wrap; }
.rank-badge {
  font-size: 1.6vh; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 0.2vh 0.7vw; border-radius: 2px;
}
.rank-lp    { font-size: 1.4vh; font-weight: 700; color: rgba(255,255,255,0.6); }
.rank-record { font-size: 1.3vh; font-weight: 600; color: rgba(255,255,255,0.4); }
.rank-wr    { font-size: 1.3vh; font-weight: 700; }
.no-rank    { font-size: 1.3vh; color: rgba(255,255,255,0.2); font-style: italic; }

.pc-champs { display: flex; flex-direction: column; gap: 0.35vh; }
.champ-row { display: flex; align-items: center; gap: 0.8vw; }
.champ-name { font-size: 1.4vh; font-weight: 700; min-width: 9vw; text-transform: uppercase; letter-spacing: 0.04em; }
.champ-games { font-size: 1.2vh; color: rgba(255,255,255,0.45); min-width: 3.5vw; }
.champ-wr-bar { flex: 1; height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; max-width: 8vw; overflow: hidden; }
.champ-wr-fill { height: 100%; border-radius: 2px; }
.champ-wr-pct { font-size: 1.2vh; font-weight: 700; min-width: 3.5vw; text-align: right; }
.no-champs  { font-size: 1.2vh; color: rgba(255,255,255,0.2); font-style: italic; }

/* ── No data placeholder ── */
.no-data { color: rgba(255,255,255,0.15); font-style: italic; font-size: 1.2vh; padding: 0.4vh 0; }

/* ── Tier colours ── */
.tier-IRON        { background: rgba(90,90,90,0.25);  color: #a0a0a0; }
.tier-BRONZE      { background: rgba(140,85,40,0.25); color: #cd9b6a; }
.tier-SILVER      { background: rgba(160,168,180,0.2);color: #c8d0dc; }
.tier-GOLD        { background: rgba(212,175,55,0.25);color: #f0cc44; }
.tier-PLATINUM    { background: rgba(0,180,170,0.2);  color: #00e0d0; }
.tier-EMERALD     { background: rgba(45,155,100,0.25);color: #4dcc90; }
.tier-DIAMOND     { background: rgba(80,130,200,0.25);color: #88b8f0; }
.tier-MASTER      { background: rgba(155,72,224,0.25);color: #c080f8; }
.tier-GRANDMASTER { background: rgba(220,50,50,0.25); color: #f07070; }
.tier-CHALLENGER  { background: rgba(0,200,255,0.2);  color: #00d4ff; }

/* ── WR colour ── */
.wr-high { color: #4dcc90; }
.wr-mid  { color: #f0cc44; }
.wr-low  { color: #f07070; }

/* ── Last updated ── */
#refresh-note {
  flex-shrink: 0; padding: 0.8vh 2vw;
  background: rgba(0,0,0,0.4); border-top: 1px solid rgba(255,255,255,0.06);
  font-size: 1.1vh; color: rgba(255,255,255,0.25); letter-spacing: 0.05em;
  display: flex; justify-content: space-between;
}
</style>
</head>
<body>
<div id="root">
  <div class="match-header" id="match-header"></div>
  <div class="teams-grid" id="teams-grid"></div>
  <div id="refresh-note">
    <span>STATS REFERENCE — for design use only</span>
    <span id="last-updated"></span>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const _gfxToken = new URLSearchParams(window.location.search).get('token') || '';
const socket = io({ auth: { token: _gfxToken }, query: { token: _gfxToken } });

const TIER_ORDER = ['IRON','BRONZE','SILVER','GOLD','PLATINUM','EMERALD','DIAMOND','MASTER','GRANDMASTER','CHALLENGER'];

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function wrClass(pct) {
  if (pct >= 60) return 'wr-high';
  if (pct >= 50) return 'wr-mid';
  return 'wr-low';
}

function rankBadge(rank) {
  if (!rank || !rank.tier) return '<span class="no-rank">No rank data</span>';
  const tier = rank.tier;
  const div  = (rank.division && rank.division !== 'I' || tier === 'MASTER' || tier === 'GRANDMASTER' || tier === 'CHALLENGER') ? '' : ' ' + rank.division;
  const totalGames = (rank.wins || 0) + (rank.losses || 0);
  const wr = totalGames ? Math.round(rank.wins / totalGames * 100) : 0;
  return `
    <span class="rank-badge tier-${esc(tier)}">${esc(tier)}${esc(div)}</span>
    <span class="rank-lp">${rank.lp} LP</span>
    <span class="rank-record">${rank.wins}W / ${rank.losses}L</span>
    <span class="rank-wr ${wrClass(wr)}">${wr}% WR</span>`;
}

function champRows(pool) {
  if (!pool || !pool.length) return '<span class="no-champs">No champion data</span>';
  return pool.slice(0, 7).map(c => {
    const wr = Math.round(c.wins / c.games * 100);
    return `<div class="champ-row">
      <span class="champ-name">${esc(c.name)}</span>
      <span class="champ-games">${c.games}g</span>
      <div class="champ-wr-bar"><div class="champ-wr-fill" style="width:${wr}%;background:${wr>=60?'#4dcc90':wr>=50?'#f0cc44':'#f07070'}"></div></div>
      <span class="champ-wr-pct ${wrClass(wr)}">${wr}%</span>
    </div>`;
  }).join('');
}

function playerCard(p) {
  return `<div class="player-card">
    <div class="pc-top">
      <span class="pc-role">${esc(p.role)}</span>
      <span class="pc-handle">${esc(p.handle || '—')}</span>
      ${p.riotId ? `<span class="pc-riot-id">${esc(p.riotId)} · ${esc((p.opggRegion||'').toUpperCase())}</span>` : ''}
    </div>
    <div class="pc-rank-row">${rankBadge(p.rank)}</div>
    <div class="pc-champs">${champRows(p.champPool)}</div>
  </div>`;
}

function teamCol(team, players) {
  const logo = team.logo ? `<img src="${esc(team.logo)}" alt="">` : '';
  const header = `<div class="team-header" style="border-left: 3px solid ${esc(team.color||'#1ffaff')}">
    ${logo}
    <div>
      <div class="t-name">${esc(team.name)}</div>
      <div class="t-tag">${esc(team.tag)}</div>
    </div>
  </div>`;
  const cards = (players || []).map(p => playerCard(p)).join('');
  return `<div class="team-col">${header}${cards}</div>`;
}

socket.on('state', state => {
  GfxSettings.applyTheme(document.documentElement, state);

  const match   = state.match   || {};
  const players = state.players || {};
  const t1 = match.team1 || {}, t2 = match.team2 || {};

  // Match header
  const hdr = document.getElementById('match-header');
  hdr.innerHTML = `
    <span class="team-name" style="color:${esc(t1.color||'#fff')}">${esc(t1.name||'Team 1')}</span>
    <span class="vs">VS</span>
    <span class="team-name" style="color:${esc(t2.color||'#fff')}">${esc(t2.name||'Team 2')}</span>`;

  // Teams grid
  const grid = document.getElementById('teams-grid');
  grid.innerHTML =
    teamCol(t1, players.team1) +
    teamCol(t2, players.team2);

  // Timestamp
  const lu = document.getElementById('last-updated');
  const rankTs  = (players.team1 || []).concat(players.team2 || []).some(p => p.rank);
  const champTs = (players.team1 || []).concat(players.team2 || []).some(p => p.champPool);
  lu.textContent = 'Rank: ' + (rankTs ? 'loaded' : 'not fetched') + '  ·  Champ pools: ' + (champTs ? 'loaded' : 'not fetched');
});
</script>
</body>
</html>
