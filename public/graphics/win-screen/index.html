<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Win Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<script src="/graphics/gfx-settings.js"></script>
<link rel="stylesheet" href="win.css">
</head>
<body>
<div id="win-root" class="style-blade" style="display:none">

  <!-- Solid base — shown for full-screen styles so OBS sees an opaque source -->
  <div class="ws-fullscreen-bg"></div>

  <!-- COMP living background (bespoke CSS animation or a premade BG canvas) -->
  <div class="ws-comp-bg" id="ws-comp-bg"></div>

  <!-- BLADE: parallelogram band that sweeps across -->
  <div class="ws-blade-bg"></div>
  <div class="ws-blade-line ws-blade-line-top"></div>
  <div class="ws-blade-line ws-blade-line-bot"></div>

  <!-- BURST: detonates from center outward -->
  <div class="ws-burst-bg"></div>
  <div class="ws-burst-flash"></div>
  <div class="ws-burst-ring ws-burst-ring-1"></div>
  <div class="ws-burst-ring ws-burst-ring-2"></div>
  <div class="ws-burst-ring ws-burst-ring-3"></div>

  <!-- SLAM: full-screen overlay -->
  <div class="ws-slam-overlay"></div>

  <!-- SPLIT: vertical divide, winner's colour floods left panel -->
  <div class="ws-split-overlay"></div>
  <div class="ws-split-panel-l"></div>
  <div class="ws-split-divider"></div>
  <canvas class="ws-split-particles" id="ws-split-canvas"></canvas>

  <!-- SPOTLIGHT: darkened screen + beam from above + sparkle canvas -->
  <div class="ws-spotlight-overlay"></div>
  <div class="ws-spotlight-beam"></div>
  <canvas class="ws-spotlight-particles" id="ws-spotlight-canvas"></canvas>

  <!-- WIPE: cinematic letterbox bars close in from top and bottom -->
  <div class="ws-wipe-bar-top"></div>
  <div class="ws-wipe-bar-bot"></div>
  <div class="ws-wipe-streak"></div>

  <!-- SHUTTER (stinger): opaque panels drive in from top + bottom to full cover -->
  <div class="ws-shutter-top"></div>
  <div class="ws-shutter-bot"></div>

  <!-- FLOOD (stinger): solid colour floods across the whole frame on an angled wipe -->
  <div class="ws-flood-fill"></div>

  <!-- PUSH SLAB (stinger): full-screen opaque slab pushes up from the bottom -->
  <div class="ws-slab"></div>

  <!-- COMP / draft-picks row (hero for the COMP style; compact layer when showPicks is on) -->
  <div class="ws-comp-row" id="ws-comp-row"></div>

  <!-- Shared content card (positioned differently per style via CSS) -->
  <div class="ws-card" id="ws-card">
    <div class="ws-logo" id="ws-logo"></div>
    <div class="ws-text">
      <div class="ws-tag" id="ws-tag">✦ VICTORY ✦</div>
      <div class="ws-name" id="ws-name"></div>
      <div class="ws-message" id="ws-message"></div>
      <div class="ws-score-row" id="ws-score-row" style="display:none">
        <div class="ws-score-val" id="ws-score-t1"></div>
        <div class="ws-score-sep">—</div>
        <div class="ws-score-val" id="ws-score-t2"></div>
      </div>
    </div>
  </div>

</div>
<script src="/socket.io/socket.io.js"></script>
<script src="win.js"></script>
</body>
</html>
