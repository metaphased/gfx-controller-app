<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lower Third</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px;
    background: transparent;
    font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    overflow: hidden;
    position: relative;
  }

  :root {
    --bg: var(--gfx-c4, #0a1b20);
    --accent: var(--gfx-c2, #a7a38e);
    --primary: var(--gfx-c1, #1ffaff);
  }

  .lower-third {
    position: absolute;
    bottom: 120px;
    left: 80px;
    display: flex;
    align-items: stretch;
    opacity: 0;
    transform: translateX(-60px);
    transition: opacity 0.4s cubic-bezier(.4,0,.2,1), transform 0.4s cubic-bezier(.4,0,.2,1);
    pointer-events: none;
  }
  .lower-third.side-right {
    left: auto; right: 80px;
    transform: translateX(60px);
    flex-direction: row-reverse;
  }
  .lower-third.visible {
    opacity: 1;
    transform: translateX(0);
  }

  .lt-bar {
    width: 6px;
    background: var(--primary);
    flex-shrink: 0;
    border-radius: 3px 0 0 3px;
  }
  .lower-third.side-right .lt-bar { border-radius: 0 3px 3px 0; }

  .lt-body {
    background: var(--bg);
    padding: 14px 28px 14px 22px;
    position: relative;
    clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%);
    min-width: 320px;
  }
  .lower-third.side-right .lt-body {
    clip-path: polygon(20px 0, 100% 0, 100% 100%, 0 100%, 0 20px);
  }

  .lt-super {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--primary);
    margin-bottom: 4px;
  }
  .lt-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 36px;
    font-weight: 800;
    color: var(--gfx-c3, #ffffff);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    line-height: 1;
  }
  .lt-sub {
    font-family: 'Barlow', sans-serif;
    font-size: 15px;
    font-weight: 400;
    color: var(--accent);
    margin-top: 4px;
    letter-spacing: 0.05em;
  }

  /* Team logo version */
  .lt-logo {
    width: 70px;
    height: 70px;
    object-fit: contain;
    margin-right: 16px;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="lower-third" id="lt">
  <div class="lt-bar" id="lt-bar"></div>
  <div class="lt-body">
    <div class="lt-super" id="lt-super"></div>
    <div class="lt-name" id="lt-name">Player Name</div>
    <div class="lt-sub" id="lt-sub"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/graphics/gfx-settings.js"></script>
<script>
const _gfxToken = new URLSearchParams(window.location.search).get('token') || '';
const socket = io({ auth: { token: _gfxToken }, query: { token: _gfxToken } });

const el  = document.getElementById('lt');
const bar = document.getElementById('lt-bar');

let _ltFp = null;
socket.on('state', (state) => {
  if (window.GfxSettings) GfxSettings.applyTheme(document.documentElement, state); // palette, always (before fingerprint guard)
  const lt = state.lowerThird;
  const key = JSON.stringify([lt.visible, lt.text, lt.subtext, lt.supertext, lt.side, state.match.tournament]);
  if (_ltFp === key) return;
  _ltFp = key;

  document.getElementById('lt-super').textContent = lt.supertext || state.match.tournament || '';
  document.getElementById('lt-name').textContent  = lt.text    || '';
  document.getElementById('lt-sub').textContent   = lt.subtext || '';

  el.classList.toggle('side-right', lt.side === 'right');
  el.classList.toggle('visible',    !!lt.visible);
});
</script>
</body>
</html>
